---
name: Validate pull request
on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      base_ref:
        description: 'Base branch reference'
        required: true
        type: string

jobs:
  # Detect whether src/pages files changed.
  # All checker jobs depend on this output to decide whether to run.
  check-files:
    runs-on: ubuntu-latest
    outputs:
      run_validation: ${{ steps.filter.outputs.run_validation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for src/pages changes
        id: filter
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if echo "$CHANGED_FILES" | grep -q "^src/pages/"; then
            echo "run_validation=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in src/pages/"
          else
            echo "run_validation=false" >> $GITHUB_OUTPUT
            echo "⏭️ No changes in src/pages/, skipping validation"
          fi

  # ── Checker jobs ────────────────────────────────────────────────────────────
  # To add a new checker:
  #   1. Add a job here with `needs: [check-files]` and
  #      `if: needs.check-files.outputs.run_validation == 'true'`
  #   2. Add it to the `needs` list of the `validate-pr` gate job below
  #   3. Add a result check for it in the gate job's run step
  # ────────────────────────────────────────────────────────────────────────────

  lint:
    needs: [check-files]
    if: needs.check-files.outputs.run_validation == 'true'
    uses: ./.github/workflows/lint-v3.yml
    with:
      pr_number: ${{ inputs.pr_number }}

  # When src/pages/ is unchanged the lint job is skipped entirely and produces
  # no artifact. Upload a sentinel so post-lint-comment-v3.yml can always
  # download the artifact and detect that lint did not run.
  upload-lint-skip-marker:
    needs: [check-files]
    if: needs.check-files.outputs.run_validation != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create skipped marker
        run: echo "skipped" > lint-skipped.txt
      - name: Upload linter-report artifact (skipped marker)
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: lint-skipped.txt

  # ── Add new checker jobs above this line ────────────────────────────────────

  # Gate job — always runs regardless of whether checkers were skipped or failed.
  # This is the single job to set as a required check in branch protection,
  # solving the "required check never ran" problem when no src/pages files changed.
  validate-pr:
    runs-on: ubuntu-latest
    needs: [check-files, lint]
    # When adding a new checker job, add it to the needs list above.
    if: always()
    steps:
      - name: Check validation results
        env:
          RUN_VALIDATION: ${{ needs.check-files.outputs.run_validation }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          # No src/pages files changed — pass automatically
          if [[ "$RUN_VALIDATION" == "false" ]]; then
            echo "✅ No src/pages/ files changed - validation skipped"
            exit 0
          fi

          # src/pages files changed — all checker jobs must have succeeded.
          # When adding a new checker job, add its result check here.
          if [[ "$LINT_RESULT" == "success" ]]; then
            echo "✅ All validation checks passed"
            exit 0
          else
            echo "❌ One or more validation checks failed"
            echo "  lint: $LINT_RESULT"
            exit 1
          fi
