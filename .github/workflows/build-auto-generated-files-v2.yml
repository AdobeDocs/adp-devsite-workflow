---
name: Build Auto-Generated Files
on:
  workflow_call:
    inputs:
      baseSha:
        type: string
        required: false
      buildAll:
        type: boolean
        required: false
        default: false
      changelogPath:
        description: Path of the changelog file to build the RSS feed from, e.g. src/pages/guides/changelog/index.md. The feed is skipped when empty.
        type: string
        required: false
        default: ""
      feedPath:
        description: Path where the generated RSS feed is written
        type: string
        required: false
        default: "src/pages/feed.xml"
    secrets:
      ADP_DEVSITE_APP_ID:
        required: true
      ADP_DEVSITE_APP_PRIVATE_KEY:
        required: true

jobs:
  build-contributors:
    name: Build Contributors
    if: github.repository != 'AdobeDocs/dev-docs-template'
    uses: ./.github/workflows/build-contributors-v2.yml
    with:
      baseSha: ${{ inputs.baseSha }}
      buildAll: ${{ inputs.buildAll }}
    secrets:
      ADP_DEVSITE_APP_ID: ${{ secrets.ADP_DEVSITE_APP_ID }}
      ADP_DEVSITE_APP_PRIVATE_KEY: ${{ secrets.ADP_DEVSITE_APP_PRIVATE_KEY }}

  build-site-metadata:
    name: Build Site Metadata
    needs: build-contributors
    if: |
      always() &&
      github.repository != 'AdobeDocs/dev-docs-template'
    uses: ./.github/workflows/build-site-metadata-v2.yml
    secrets:
      ADP_DEVSITE_APP_ID: ${{ secrets.ADP_DEVSITE_APP_ID }}
      ADP_DEVSITE_APP_PRIVATE_KEY: ${{ secrets.ADP_DEVSITE_APP_PRIVATE_KEY }}

  build-rss-feed:
    name: Build RSS Feed
    needs: build-site-metadata
    if: |
      always() &&
      inputs.changelogPath != '' &&
      github.repository != 'AdobeDocs/dev-docs-template'
    uses: ./.github/workflows/build-rss-feed-v2.yml
    with:
      baseSha: ${{ inputs.baseSha }}
      buildAll: ${{ inputs.buildAll }}
      changelogPath: ${{ inputs.changelogPath }}
      feedPath: ${{ inputs.feedPath }}
    secrets: inherit
