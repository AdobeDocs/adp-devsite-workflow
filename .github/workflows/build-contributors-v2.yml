---
name: Build Contributors
on:
  workflow_call:
    inputs:
      baseSha:
        type: string
        required: false
      buildAll:
        type: boolean
        required: false
        default: false

jobs:
  build-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/krypton"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ADP_DEVSITE_APP_ID }}
          private-key: ${{ secrets.ADP_DEVSITE_APP_PRIVATE_KEY }}

      - name: Build Contributors
        run: npx --yes github:AdobeDocs/adp-devsite-utils#node-24 buildContributorsV2 -v $BUILD_ALL_FLAG
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ inputs.baseSha || github.event.before }}
          BUILD_ALL_FLAG: ${{ inputs.buildAll && '--all' || '' }}

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          git add src/pages/contributors.json
          git pull
          git diff --cached --quiet || git commit -m "chore: auto-generate contributors"
          git push
